<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Alarm</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: #fff; user-select: none;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  #bg { position: fixed; inset: -60px; background: #15151a center / cover no-repeat; filter: blur(26px) brightness(.55) saturate(1.2); }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vh; text-align: center; }
  #now { font-size: 15vh; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  h1 { margin: 0; font-size: 5.5vh; font-weight: 600; letter-spacing: .01em; animation: pulse 1.2s ease-in-out infinite; }
  #label { font-size: 2.6vh; opacity: .8; max-width: 70vw; overflow-wrap: anywhere; min-height: 3vh; }
  .btns { display: flex; flex-direction: column; gap: 14px; margin-top: 4vh; width: min(340px, 70vw); }
  button { height: 60px; border: 0; border-radius: 30px; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer; }
  #snooze { background: var(--accent, #ff9f0a); color: #101010; }
  #stop { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(10px); }
  button:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  small { opacity: .55; font-size: 13px; margin-top: 1vh; }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <div id="now"></div>
  <h1>Alarm rang</h1>
  <div id="label"></div>
  <div class="btns">
    <button id="snooze">Snooze</button>
    <button id="stop">Stop</button>
  </div>
  <small>Enter to snooze · Esc to stop</small>
</main>
<script src="alarm-overlay.js"></script>
</body>
</html>

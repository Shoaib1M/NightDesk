<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Nightdesk pet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  #wrap { position: fixed; left: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: flex-start; }
  canvas { image-rendering: pixelated; cursor: grab; animation: bob 2.4s ease-in-out infinite; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .45)); }
  body.work canvas { animation-duration: .7s; }
  body.sleep canvas, body.sad canvas { animation-duration: 4s; }
  body.cheer canvas { animation: hop .45s ease-out infinite; }
  #say { max-width: 220px; margin: 0 0 8px 4px; padding: 8px 12px; border-radius: 12px 12px 12px 3px; background: #111112; color: #e4e4e6;
    border: 1px solid #2c2c31; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
  #zz { position: absolute; left: 70px; bottom: 70px; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; opacity: 0; }
  body.sleep #zz { animation: zz 2.6s linear infinite; }
  [hidden] { display: none !important; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  @keyframes hop { 50% { transform: translateY(-16px); } }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0) scale(.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -24px) scale(1.3); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="say" hidden></div>
  <span id="zz">z</span>
  <canvas id="cv" width="16" height="18" title="Drag me. Click to open Nightdesk."></canvas>
</div>
<script src="pet-sprite.js"></script>
<script src="pet-desktop.js"></script>
</body>
</html>
